AllCops:
  # Matches the Ruby the container runs. Claiming 3.2 here made RuboCop flag
  # `require "set"` as redundant — true from 3.1, wrong on 3.0.
  TargetRubyVersion: 3.0
  Exclude:
    # Generated by `appraisal generate`; linting it just produces offenses
    # that reappear on every regeneration.
    - "gemfiles/**/*"

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Layout/ExtraSpacing:
  AllowForAlignment: true
  ForceEqualSignAlignment: true

Layout/HashAlignment:
  EnforcedHashRocketStyle: table
  EnforcedColonStyle: table
  EnforcedLastArgumentHashStyle: always_inspect

Layout/SpaceAroundOperators:
  AllowForAlignment: true

Layout/ArgumentAlignment:
  EnforcedStyle: with_first_argument

Layout/ParameterAlignment:
  EnforcedStyle: with_first_parameter

# `completion_sql` is one 20-line heredoc. Counting it as a single line keeps
# the metric measuring code rather than SQL.
#
# Max is nudged past the default 100: SidekiqBatch carries both the record and
# the class-level completion entry point, which exists so the hot path can run
# the completion UPDATE without loading a batch it will usually not transition.
# It also answers progress three ways from two sources, since a finished batch
# reads the tally on its own row and a running one counts job rows.
Metrics/ClassLength:
  Max: 120
  CountAsOne:
    - heredoc

# RSpec example groups are blocks, and their length says nothing useful about
# complexity. (rubocop-rspec would configure this for us; it is not worth the
# extra dependency and its ~100 new cops just for this.)
Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    # A gemspec is one long Gem::Specification block by construction.
    - "*.gemspec"
