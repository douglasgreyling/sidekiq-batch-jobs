AllCops:
  TargetRubyVersion: 3.2

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

# Force `=` in consecutive assignments to line up.
Layout/ExtraSpacing:
  AllowForAlignment: true
  ForceEqualSignAlignment: true

# Force hash keys/values into a table (aligned colons and values).
Layout/HashAlignment:
  EnforcedHashRocketStyle: table
  EnforcedColonStyle: table
  EnforcedLastArgumentHashStyle: always_inspect

# Allow aligning operators with extra spaces (e.g. `a  = 1` next to `bb = 2`).
Layout/SpaceAroundOperators:
  AllowForAlignment: true

# Align method arguments that span multiple lines.
Layout/ArgumentAlignment:
  EnforcedStyle: with_first_argument

Layout/ParameterAlignment:
  EnforcedStyle: with_first_parameter
